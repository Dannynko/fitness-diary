name: KT Daily Sync

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Scrape KT and push to Gist
        env:
          KT_EMAIL: ${{ secrets.KT_EMAIL }}
          KT_PASSWORD: ${{ secrets.KT_PASSWORD }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
        run: node .github/scripts/kt-scrape.js
